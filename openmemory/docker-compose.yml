version: '3.8'
services:
  redis:
    image: redis/redis-stack:latest
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --maxmemory
    - 16gb
    - --maxmemory-policy
    - allkeys-lru
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 30s
      retries: 3
    networks:
    - memnet
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0
      POSTGRES_DB: mem0
    volumes:
    - pg_data:/var/lib/postgresql/data
    networks:
    - memnet
  neo4j:
    image: neo4j:5.26.4
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
    - neo4j_data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - http://localhost:7474
      interval: 30s
      retries: 3
    networks:
    - memnet
  openmemory-api:
    build: ./api
    env_file:
    - .env.production
    ports:
    - 127.0.0.1:8765:8765
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
      neo4j:
        condition: service_healthy
    networks:
    - memnet
    - traefik
    labels:
    - traefik.enable=true
    - traefik.docker.network=traefik
    - traefik.http.routers.openmemory-api.rule=Host(`fullmem.drjlabs.com`)
    - traefik.http.routers.openmemory-api.entrypoints=websecure
    - traefik.http.routers.openmemory-api.tls=true
    - traefik.http.services.openmemory-api.loadbalancer.server.port=8765
    environment:
    - REDIS_COLLECTION_NAME=${REDIS_COLLECTION_NAME}
    - DATABASE_URL=${DATABASE_URL}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - EMBEDDING_MODEL=${EMBEDDING_MODEL}
    - LLM_MODEL=${LLM_MODEL}
    - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    - REDIS_URL=${REDIS_URL}
    - NEO4J_URI=${NEO4J_URI}
    - NEO4J_USERNAME=${NEO4J_USERNAME}
    - ENABLE_DEEP_READINESS=${ENABLE_DEEP_READINESS}
  openmemory-ui:
    build: ./ui
    env_file:
    - .env.production
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
    - openmemory-api
    networks:
    - memnet
    - traefik
    labels:
    - traefik.enable=true
    - traefik.docker.network=traefik
    - traefik.http.routers.openmemory-ui.rule=Host(`openmemory.drjlabs.com`)
    - traefik.http.routers.openmemory-ui.entrypoints=websecure
    - traefik.http.routers.openmemory-ui.tls=true
    - traefik.http.services.openmemory-ui.loadbalancer.server.port=3000
volumes:
  redis_data: null
  pg_data: null
  neo4j_data: null
networks:
  memnet:
    driver: bridge
  traefik:
    external: true
